<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Transaction | FinTrack</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/transaction.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header><a class="brand-link" href="index.html" aria-label="Personal Finance Tracker home"><img class="brand-logo" src="assets/images/logo.png.png" alt="Personal Finance Tracker"></a><a class="btn btn-secondary" href="transaction.html">← Back to Transactions</a></header>
    <main>
        <div class="page-heading"><div><span class="eyebrow">Keep your ledger current</span><h1 id="transactionFormTitle">Add Transaction</h1><p>Capture the detail now so your financial picture stays useful.</p></div></div>
        <section class="card" style="max-width: 760px; padding: 28px;">
            <form id="transactionForm">
                <div class="form-group"><label>Transaction Type</label><div style="display:flex; gap:18px; margin-top:8px;"><label class="checkbox-group"><input type="radio" name="type" id="transactionType" value="expense" checked> Expense</label><label class="checkbox-group"><input type="radio" name="type" value="income"> Income</label></div></div>
                <div class="profile-form"><div class="form-group"><label for="transactionTitle">Title</label><input id="transactionTitle" type="text" placeholder="e.g. Weekly groceries" required></div><div class="form-group"><label for="transactionAmount">Amount</label><input id="transactionAmount" type="number" min="0" step="0.01" placeholder="₹ 0.00" required></div><div class="form-group"><label for="transactionCategory">Category</label><select id="transactionCategory" required><option value="">Select category</option><option>Food</option><option>Transport</option><option>Shopping</option><option>Entertainment</option><option>Bills</option><option>Education</option><option>Health</option><option>Salary</option><option>Other</option></select></div><div class="form-group"><label for="transactionDate">Date</label><input id="transactionDate" type="date" required></div><div class="form-group"><label for="transactionDescription">Description</label><textarea id="transactionDescription" placeholder="Add a note about this transaction"></textarea></div></div>
                <div class="form-actions"><button type="submit">Save Transaction</button><button class="btn-secondary" id="cancelTransaction" type="button">Cancel</button></div>
            </form>
        </section>
    </main>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/add-transaction.js"></script>
</body>
</html>
