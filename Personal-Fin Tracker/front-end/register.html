<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | FinTrack</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header>
        <a class="brand-link" href="index.html" aria-label="Personal Finance Tracker home"><img class="brand-logo" src="assets/images/logo.png.png" alt="Personal Finance Tracker"></a>
        <nav class="nav-links"><a href="index.html">Home</a><a href="login.html">Login</a></nav>
    </header>
    <main class="auth-page">
        <section class="auth-container">
            <div class="auth-intro">
                <img class="brand-logo" src="assets/images/logo.png.png" alt="Personal Finance Tracker">
                <span class="eyebrow">Start with clarity</span>
                <h1>Build your better money routine.</h1>
                <p>Create a private workspace for your income, expenses and goals.</p>
                <div class="auth-features"><div class="auth-feature"><span class="auth-feature-icon">+</span><span>Capture every transaction</span></div><div class="auth-feature"><span class="auth-feature-icon">✓</span><span>Plan with confidence</span></div></div>
            </div>
            <div class="auth-form">
                <h2>Create your account</h2>
                <p class="auth-form-subtitle">It only takes a minute to get started.</p>
                <form id="registerForm" novalidate>
                    <div class="form-group"><label for="name">Full Name</label><input type="text" id="name" name="name" placeholder="Your full name" autocomplete="name" required></div>
                    <div class="form-group"><label for="email">Email Address</label><input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required></div>
                    <div class="form-group"><label for="password">Password</label><div class="password-wrapper"><input type="password" id="password" name="password" placeholder="At least 6 characters" autocomplete="new-password" required><button class="password-toggle" type="button">Show</button></div></div>
                    <div class="form-group"><label for="confirmPassword">Confirm Password</label><div class="password-wrapper"><input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat your password" autocomplete="new-password" required><button class="password-toggle" type="button">Show</button></div></div>
                    <label class="checkbox-group"><input type="checkbox" required> I agree to the Terms &amp; Conditions</label>
                    <button class="auth-button" type="submit">Create Account</button>
                </form>
                <p class="auth-form-subtitle">Already have an account? <a href="login.html">Login</a></p>
            </div>
        </section>
    </main>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
